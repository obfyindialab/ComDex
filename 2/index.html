<style>
/* Design tokens from super_money.css */
:root{
--color-primary:#4d43fe;--color-primary-50:#d7ecff;--color-primary-100:#c9dfff;--color-primary-200:#b5cbff;--color-primary-300:#9aadff;--color-primary-500:#5f60ff;--color-primary-600:#4d43fe;--color-primary-700:#3d33d3;
--color-bg:#fff;--color-bg-1:#1b1b1b;--color-bg-3:#e0eaff;--color-neutral-500:#eef4fe;--color-neutral-600:#6c6c6c;
--color-text-1:#1b1b1b;--color-text-3:#adacbe;--color-text-4:#eaecf0;
--radius-md:10px;--radius-lg:16px;--radius-full:9999px;
--shadow-xs:rgba(74,58,255,.1) 0 6px 16px 0;--shadow-sm:rgba(41,30,255,.45) 0 8px 28px 0;
--font-sans:'Anek Latin','AnekLatin',sans-serif;--font-font-1:'Figtree',system-ui,sans-serif;
--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sp:50;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--color-neutral-500);color:var(--color-text-1);font:14px/1.4 var(--font-font-1)}
:focus-visible{outline:2px solid var(--color-primary-500);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:relative;background:#fff;border-bottom:1px solid var(--color-text-4)}
.brand{display:flex;align-items:center;gap:9px;font:700 21px var(--font-sans);letter-spacing:-.01em}
.logo{width:28px;height:28px}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--color-text-4);border-radius:var(--radius-full);background:#fff;font-weight:500;white-space:nowrap;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--color-primary-300);background:var(--color-neutral-500)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn[aria-pressed=true]{background:var(--color-bg-3);border-color:var(--color-primary-300);color:var(--color-primary-700)}
.btn[aria-pressed=true]:hover{background:var(--color-primary-50)}
.pri{background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:var(--shadow-xs)}
.pri:hover{background:var(--color-primary-700);border-color:var(--color-primary-700);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
select,input[type=text]{height:34px;padding:0 10px;border:1px solid var(--color-text-4);border-radius:var(--radius-md);background:#fff}
input[type=text]{width:170px;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--color-primary-500)}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;pointer-events:none}
#prog i{display:block;width:35%;height:100%;background:var(--color-primary);border-radius:2px;opacity:0}
#prog.on i{opacity:1;animation:sweep .8s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
main{flex:1;display:flex;min-height:0;padding:10px}
main.v{flex-direction:column}
#edw,#pvw{position:relative;min-width:0;min-height:0;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-xs);animation:open .6s var(--ease) backwards}
#edw{flex:var(--sp) 1 0%}
#pvw{flex:calc(100 - var(--sp)) 1 0%;background:#fff;animation-delay:.08s}
@keyframes open{from{clip-path:inset(0 0 100% 0 round 16px);opacity:0}to{clip-path:inset(0 0 0 0 round 16px);opacity:1}}
textarea,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
textarea{padding:18px;outline:0;resize:none;background:#fff;color:var(--color-text-1);font:14px/1.65 var(--mono);tab-size:2;transition:background .3s,color .3s}
.dark textarea{background:var(--color-bg-1);color:var(--color-text-4);caret-color:var(--color-primary-300);color-scheme:dark}
textarea::selection{background:var(--color-primary-200)}
.dark textarea::selection{background:var(--color-primary-600);color:#fff}
iframe{background:#fff}
#gut{flex:none;width:14px;display:grid;place-items:center;cursor:col-resize;touch-action:none}
#gut::after{content:"";width:4px;height:40px;border-radius:9px;background:var(--color-primary-200);transition:width .2s var(--ease),height .2s var(--ease),background .2s,box-shadow .2s}
#gut:hover::after,#gut:focus-visible::after,.drag #gut::after{height:64px;background:var(--color-primary);box-shadow:var(--shadow-sm)}
main.v #gut{width:auto;height:14px;cursor:row-resize}
main.v #gut::after{width:40px;height:4px}
main.v #gut:hover::after,main.v #gut:focus-visible::after,main.v.drag #gut::after{width:64px;height:4px}
.drag iframe,.drag textarea{pointer-events:none}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:7px 14px;background:#fff;border-top:1px solid var(--color-text-4);font-size:12px;color:var(--color-neutral-600)}
footer.off{display:none}
footer b{font:400 12px var(--mono);color:var(--color-text-1)}
footer a{color:inherit}
address{margin:0;font-style:normal}
.share{display:flex;align-items:center;gap:2px;margin-left:auto}
.share span{margin-right:4px}
.share a,.share button{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.share a:hover,.share button:hover{background:var(--color-bg-3);color:var(--color-primary-700);transform:translateY(-1px)}
#toast{position:fixed;left:50%;bottom:60px;z-index:9;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-full);background:var(--color-bg-1);color:#fff;box-shadow:var(--shadow-sm);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .i{color:var(--color-primary-300)}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
.row{display:flex;align-items:center;gap:8px;padding:10px 14px}
.ib{display:grid;place-items:center;width:30px;height:30px;flex:none;border:0;border-radius:8px;background:none;color:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,transform .15s}
.ib:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.ib:active{transform:scale(.92)}
.ib[aria-pressed=true]{background:var(--color-primary);color:#fff}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--color-neutral-500)}
.seg .ib{width:30px;height:26px;color:var(--color-neutral-600)}
.seg .ib[aria-pressed=true]{background:#fff;color:var(--color-primary-700);box-shadow:var(--shadow-xs)}
.seg.m{display:none}
.seg.m .ib{width:auto;height:30px;padding:0 14px}
#edw,#pvw{display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:2px;flex:none;height:42px;padding:0 8px 0 12px;background:#fff;border-bottom:1px solid var(--color-text-4);transition:background .3s,color .3s,border-color .3s}
.dark .ph{background:#232323;border-color:#333;color:var(--color-text-4)}
.fn{display:flex;align-items:center;gap:7px;min-width:0;margin-right:auto;font-weight:500}
.fn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn .i{color:var(--color-primary-500)}
.ph select{height:28px;padding:0 6px;border:0;border-radius:8px;background:var(--color-neutral-500);font-size:12px}
.pb{position:relative;flex:1;min-height:0}
iframe{inset:0 auto 0 50%;width:var(--dw,100%);max-width:100%;transform:translateX(-50%);transition:width .35s var(--ease),border-radius .3s,box-shadow .3s}
.pb.dev{background:var(--color-bg-3)}
.pb.dev iframe{top:12px;bottom:12px;height:auto;border-radius:12px;box-shadow:var(--shadow-xs)}
#fbar{position:absolute;top:10px;right:14px;z-index:3;display:grid;gap:8px;width:min(380px,calc(100% - 28px));padding:10px;border-radius:14px;background:#fff;color:var(--color-text-1);box-shadow:var(--shadow-sm);opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);transform-origin:top right;transition:opacity .2s,transform .3s var(--ease)}
#fbar.open{opacity:1;pointer-events:auto;transform:none}
.fr{display:flex;align-items:center;gap:6px}
.fr input{flex:1;width:auto;height:30px}
.fr .btn{height:30px;padding:0 10px;font-size:12px}
#fb{font-size:12px;color:var(--color-neutral-600)}
#fb:empty{display:none}
@media(max-width:760px){.lbl,.bt,[data-t=vertical]{display:none}.row .btn{padding:0 10px}.seg.m{display:flex}.row .grow{display:none}.row .seg{margin-left:auto}#gut{display:none}main{padding:8px}#edw,#pvw{flex:1 1 0%}main[data-view=code] #pvw,main[data-view=prev] #edw{display:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ed=$('#ed'),pv=$('#pv'),main=$('main'),prog=$('#prog'),fb=$('#fb'),undo=$('#undo'),fi=$('#fi'),ps=$('#ps'),g=$('#gut');
const mq=matchMedia('(max-width:760px)'),nf=new Intl.NumberFormat();
const S={dark:1,vertical:0,spell:0,find:0,status:1,case:0,word:0,regex:0,font:14,delay:'500',split:50,name:'template.html',view:'code',dev:'100%',q:'',r:'',ed:ed.defaultValue};
try{Object.assign(S,JSON.parse(localStorage.getItem('comdex')))}catch{}
let timer,pt,tt,st,prev=null,free=0;
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const save=()=>{S.ed=ed.value;S.q=$('#q').value;S.r=$('#r').value;try{localStorage.setItem('comdex',JSON.stringify(S))}catch{}};

function toast(m){const t=$('#toast');$('#tm').textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
function sync(){
  $$('[data-t]').forEach(b=>b.setAttribute('aria-pressed',!!S[b.dataset.t]));
  $$('[data-v]').forEach(b=>b.setAttribute('aria-pressed',S.view===b.dataset.v));
  $$('[data-d]').forEach(b=>b.setAttribute('aria-pressed',S.dev===b.dataset.d));
  $('#edw').classList.toggle('dark',!!S.dark);
  main.classList.toggle('v',!!S.vertical||mq.matches);
  main.dataset.view=S.view;
  ed.spellcheck=!!S.spell;
  $('#fbar').classList.toggle('open',!!S.find);$('#fbar').inert=!S.find;
  $('#q').placeholder=S.regex?'Pattern or /pattern/flags':'Find';
  $('#pb').style.setProperty('--dw',S.dev);$('#pb').classList.toggle('dev',S.dev!=='100%');
  ed.style.fontSize=S.font+'px';
  main.style.setProperty('--sp',S.split);
  $('#fnt').textContent=S.name;
}
function run(){prog.classList.add('on');clearTimeout(pt);pt=setTimeout(()=>prog.classList.remove('on'),500);pv.srcdoc=ed.value}
function queue(){const d=S.delay;clearTimeout(timer);if(d==='Instant')run();else if(d!=='Manual')timer=setTimeout(run,+d)}
function stats(){
  const v=ed.value,b=new Blob([v]).size;
  $('#cc').textContent=nf.format(v.length);$('#cl').textContent=v.length===1?'character':'characters';
  $('#bc').textContent=nf.format(b);$('#bl').textContent=b===1?'byte':'bytes';
}
function pos(){const l=ed.value.slice(0,ed.selectionStart).split('\n');$('#pos').textContent=`Ln ${l.length}, Col ${l.at(-1).length+1}`}
function after(){prev=null;undo.disabled=true;fb.value='';sync();run();stats();pos();save()}

/* Toggles */
$$('[data-t]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.t;S[k]=+!S[k];
  if(k==='regex'&&S.regex)S.case=S.word=0;
  if((k==='case'||k==='word')&&S[k])S.regex=0;
  fb.value='';sync();save();
  if(k==='find'&&S.find)$('#q').focus();
});
ps.onchange=()=>{S.delay=ps.value;save()};
mq.addEventListener('change',sync);

/* Editor */
ed.oninput=()=>{prev=null;undo.disabled=true;fb.value='';queue();stats();pos();clearTimeout(st);st=setTimeout(save,800)};
['keyup','click','focus'].forEach(e=>ed.addEventListener(e,pos));
ed.onkeydown=e=>{
  const m=e.ctrlKey||e.metaKey;
  if(m&&e.key==='Enter'){e.preventDefault();run()}
  else if(m&&e.key==='s'){e.preventDefault();download()}
  else if(m&&e.key==='f'){e.preventDefault();S.find=1;sync();$('#q').focus();$('#q').select()}
  else if(e.key==='Escape')free=1;
  else if(e.key==='Tab'&&!free&&!e.shiftKey){e.preventDefault();document.execCommand('insertText',false,'  ')}
  else free=0;
};
$('#fbar').onkeydown=e=>{if(e.key==='Escape'){S.find=0;sync();save();ed.focus()}};

/* Files */
const blobURL=()=>URL.createObjectURL(new Blob([ed.value],{type:'text/html;charset=utf-8'}));
function download(){const a=document.createElement('a');a.href=blobURL();a.download=S.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);toast('Downloaded '+S.name)}
$('#dl').onclick=download;
$('#run').onclick=()=>{if(mq.matches&&S.view==='code'){S.view='prev';sync();save()}run()};
$('#tab').onclick=()=>{const u=blobURL();open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),6e4)};
$('#op').onclick=()=>fi.click();
fi.onchange=async()=>{const f=fi.files[0];if(!f)return;S.name=f.name;ed.value=await f.text();after();toast('Opened '+f.name)};
$('#sel').onclick=()=>{ed.focus();ed.select()};
$('#rs').onclick=()=>{
  if(ed.value!==ed.defaultValue&&!confirm('Reset the editor to the default template? Unsaved changes will be lost.'))return;
  fi.value='';S.name='template.html';ed.value=ed.defaultValue;after();toast('Editor reset');
};

/* Find and replace */
$('#ra').onclick=()=>{
  const f=$('#q').value,r=$('#r').value,v=ed.value;
  if(!f){fb.value='Enter text to find';return}
  let p,fl='g';
  if(S.regex){const m=f.match(/^\/(.*)\/(.*)$/);if(m){p=m[1];fl=m[2].includes('g')?m[2]:m[2]+'g'}else p=f}
  else{p=esc(f);if(S.word){p=`(?<![\\p{L}\\p{N}_])${p}(?![\\p{L}\\p{N}_])`;fl+='u'}if(!S.case)fl+='i'}
  let re;try{re=new RegExp(p,fl)}catch(e){fb.value=e.message;return}
  const n=(v.match(re)||[]).length;
  if(!n){fb.value='No matches found';return}
  prev=v;
  const sub=S.regex?r.replace(/\\[nrt\\]/g,m=>({'\\n':'\n','\\r':'\r','\\t':'\t','\\\\':'\\'}[m])):null;
  ed.value=v.replace(re,sub===null?()=>r:sub);
  fb.value=`${nf.format(n)} ${n===1?'replacement':'replacements'} made`;
  undo.disabled=false;queue();stats();pos();
};
undo.onclick=()=>{ed.value=prev;prev=null;undo.disabled=true;fb.value='Replacement undone';queue();stats();pos()};
[$('#q'),$('#r')].forEach(i=>i.oninput=()=>fb.value='');

/* Splitter */
const setSp=v=>{S.split=Math.min(85,Math.max(15,v));main.style.setProperty('--sp',S.split)};
g.onpointerdown=e=>{
  g.setPointerCapture(e.pointerId);main.classList.add('drag');
  g.onpointermove=ev=>{
    const r=main.getBoundingClientRect(),v=main.classList.contains('v');
    setSp(((v?ev.clientY-r.top:ev.clientX-r.left)-17)/((v?r.height:r.width)-34)*100);
  };
  g.onpointerup=g.onpointercancel=()=>{g.onpointermove=null;main.classList.remove('drag');save()};
};
g.onkeydown=e=>{const d={ArrowLeft:-2,ArrowUp:-2,ArrowRight:2,ArrowDown:2}[e.key];if(d){e.preventDefault();setSp(S.split+d);save()}};

/* Share */
const u=encodeURIComponent(location.href),ti=encodeURIComponent('Comdex: HTML editor with live preview');
const L={x:`https://x.com/intent/post?text=${ti}&url=${u}`,fb:`https://www.facebook.com/sharer.php?u=${u}`,in:`https://www.linkedin.com/feed/?shareActive=true&shareUrl=${u}`,mail:`mailto:?subject=${ti}&body=${u}`};
$$('[data-s]').forEach(a=>a.href=L[a.dataset.s]);
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copied')}catch{toast('Copy failed. Copy the link from the address bar.')}};

/* Panes */
$$('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;sync();save();if(S.view==='prev')run()});
$$('[data-d]').forEach(b=>b.onclick=()=>{S.dev=b.dataset.d;sync();save()});
[['#fm',-1],['#fp',1]].forEach(([k,d])=>$(k).onclick=()=>{S.font=Math.min(28,Math.max(11,S.font+d));sync();save();toast('Font size '+S.font)});

/* Init */
ed.value=S.ed;$('#q').value=S.q;$('#r').value=S.r;ps.value=S.delay;
sync();run();stats();pos();
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>document.hidden&&save());
</script>
</body>
</html>
