<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Comdex HTML Max Editor is a responsive, lightweight tool for writing and previewing HTML code in real time across all devices.">
  <meta name="theme-color" content="#4d43fe">
  <title>Comdex — HTML Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. SUPER_MONEY.CSS DESIGN SYSTEM TOKENS
       ========================================================================== */
    :root {
      /* Colors — Primary */
      --color-primary: #4d43fe;
      --color-brand: #4d43fe;
      --color-action: #4d43fe;

      /* Ramp — primary (base is 600) */
      --color-primary-50: #d7ecff;
      --color-primary-100: #c9dfff;
      --color-primary-200: #b5cbff;
      --color-primary-300: #9aadff;
      --color-primary-400: #7985ff;
      --color-primary-500: #5f60ff;
      --color-primary-600: #4d43fe;
      --color-primary-700: #3d33d3;
      --color-primary-800: #3124b4;
      --color-primary-900: #271898;
      --color-primary-950: #14055f;

      /* Ramp — neutral (base is 950) */
      --color-neutral-ramp-50: #f5f5f5;
      --color-neutral-ramp-100: #eaeaea;
      --color-neutral-ramp-200: #d9d9d9;
      --color-neutral-ramp-300: #c0c0c0;
      --color-neutral-ramp-400: #9f9f9f;
      --color-neutral-ramp-500: #828282;
      --color-neutral-ramp-600: #6c6c6c;
      --color-neutral-ramp-700: #575757;
      --color-neutral-ramp-800: #464646;
      --color-neutral-ramp-900: #393939;
      --color-neutral-ramp-950: #1b1b1b;

      /* Colors — Neutrals */
      --color-neutral-50: #e5e7eb;
      --color-neutral-100: #1b1b1b;
      --color-neutral-200: #ffffff;
      --color-neutral-300: #000000;
      --color-neutral-400: #adacbe;
      --color-neutral-500: #eef4fe;

      /* Colors — Backgrounds */
      --color-bg: #ffffff;
      --color-bg-1: #1b1b1b;
      --color-bg-2: #4d43fe;
      --color-bg-3: #e0eaff;

      /* Colors — Text */
      --color-text: #ffffff;
      --color-text-1: #1b1b1b;
      --color-text-2: #4d43fe;
      --color-text-3: #adacbe;
      --color-text-4: #eaecf0;

      /* Semantic pairs */
      --surface-page-bg: #ffffff;
      --surface-page-fg: #1b1b1b;
      --surface-raised-bg: #1b1b1b;
      --surface-raised-fg: #ffffff;
      --action-primary-bg: #4d43fe;
      --action-primary-fg: #ffffff;

      /* Typography — Families */
      --font-sans: 'Anek Latin', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-font-1: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      /* Typography — Named scale */
      --font-size-display: 240px;
      --font-size-h1: 130px;
      --font-size-title-1: 100px;
      --font-size-title-2: 96px;
      --font-size-h2: 72px;
      --font-size-title-3: 67px;
      --font-size-title-4: 32px;
      --font-size-title-5: 28px;
      --font-size-title-6: 24px;
      --font-size-title-7: 22px;
      --font-size-h3: 20px;
      --font-size-title-8: 16px;
      --font-size-body: 14px;

      /* Layout & Spacing */
      --container-width: 1280px;
      --container-gutter: 102px;
      --section-rhythm: 150px;
      --grid-columns: 2;
      --spacing-4: 4px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-20: 20px;
      --spacing-24: 24px;
      --spacing-32: 32px;
      --spacing-36: 36px;
      --spacing-40: 40px;
      --spacing-48: 48px;
      --spacing-128: 128px;
      --spacing-320: 320px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 100px;
      --radius-full: 9999px;

      /* Box Shadows */
      --shadow-xs: rgba(74, 58, 255, 0.1) 0px 6px 16px 0px;
      --shadow-sm: rgba(41, 30, 255, 0.45) 0px 8px 28px 0px;

      /* Utility & Motion Variables */
      --primary: #4d43fe;
      --red: #ef4444;
      --gray200: #eaecf0;
      --superBlue50: #dbe1ff;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==========================================================================
       2. RESET & DYNAMIC VIEWPORT SHELL
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      margin: 0;
      background-color: var(--color-neutral-500);
      color: var(--surface-page-fg);
      font-family: var(--font-font-1);
      font-size: var(--font-size-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ==========================================================================
       3. RESPONSIVE HEADER & SMOOTH SCROLLING TOOLBAR
       ========================================================================== */
    header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-neutral-50);
      box-shadow: var(--shadow-xs);
      z-index: 30;
      flex-shrink: 0;
    }

    .toolbar-primary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
    }

    /* Brand Identity */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding-right: 10px;
      margin-right: 2px;
      border-right: 1px solid var(--color-neutral-50);
      user-select: none;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary-500), var(--color-primary-700));
      color: var(--color-text);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(77, 67, 254, 0.35);
      transition: transform 0.3s var(--ease-spring);
    }

    .brand:hover .brand-logo {
      transform: rotate(-6deg) scale(1.06);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--color-text-1);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      background: var(--superBlue50);
      color: var(--color-primary-700);
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--color-neutral-ramp-500);
      font-weight: 500;
    }

    /* Mobile Mode Switcher (Code | Split | Preview) */
    .mobile-view-switcher {
      display: none;
      align-items: center;
      background: var(--color-neutral-500);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--superBlue50);
      margin-left: auto;
      flex-shrink: 0;
    }

    .view-mode-btn {
      border: 0;
      background: transparent;
      color: var(--color-neutral-ramp-600);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }

    .view-mode-btn:hover {
      background: transparent;
      color: var(--color-primary);
      transform: none;
    }

    .view-mode-btn.active {
      background: var(--color-primary);
      color: var(--color-text);
      box-shadow: 0 2px 8px rgba(77, 67, 254, 0.35);
    }

    /* Scrollable Controls Strip */
    .toolbar-scroll-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    /* Control Groups */
    .control-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--color-neutral-500);
      padding: 4px 6px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(77, 67, 254, 0.08);
      flex-shrink: 0;
    }

    .control-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-neutral-ramp-700);
      padding-left: 4px;
      white-space: nowrap;
    }

    /* Interactive Controls */
    button,
    .btn-link,
    .file-upload-label,
    select {
      font-family: var(--font-font-1);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-1);
      background: var(--surface-page-bg);
      border: 1px solid var(--color-neutral-50);
      border-radius: var(--radius-sm);
      min-height: 32px;
      padding: 5px 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s var(--ease-spring), background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      white-space: nowrap;
      user-select: none;
      outline: none;
    }

    button svg,
    .btn-link svg,
    .file-upload-label svg,
    .control-label svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke-width: 2;
    }

    @media (hover: hover) {
      button:hover:not(:disabled),
      .btn-link:hover,
      .file-upload-label:hover,
      select:hover {
        border-color: var(--color-primary-300);
        background: var(--color-bg-3);
        color: var(--color-primary-700);
        transform: translateY(-1px);
      }
    }

    button:active:not(:disabled),
    .btn-link:active,
    .file-upload-label:active {
      transform: translateY(0) scale(0.96);
    }

    button:focus-visible,
    .btn-link:focus-visible,
    select:focus-visible,
    input:focus-visible {
      box-shadow: 0 0 0 3px rgba(77, 67, 254, 0.25);
      border-color: var(--color-primary);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Run Action CTA */
    #runButton {
      background: var(--action-primary-bg);
      color: var(--action-primary-fg);
      border-color: var(--color-primary-600);
      padding: 5px 14px;
      box-shadow: 0 4px 12px rgba(77, 67, 254, 0.3);
    }

    #runButton:hover {
      background: var(--color-primary-700);
      border-color: var(--color-primary-700);
      color: var(--action-primary-fg);
      box-shadow: var(--shadow-sm);
    }

    /* Download Action CTA */
    #downloadLink {
      background: var(--surface-raised-bg);
      color: var(--surface-raised-fg);
      border-color: var(--surface-raised-bg);
    }

    #downloadLink:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-text);
      box-shadow: var(--shadow-xs);
    }

    #fileInput {
      display: none;
    }

    /* Toggle Pill Buttons */
    .toggle {
      border-radius: var(--radius-full);
      padding: 5px 11px;
      background: var(--surface-page-bg);
      color: var(--color-neutral-ramp-700);
      border: 1px solid var(--color-neutral-50);
    }

    .toggle.active {
      background: var(--color-primary);
      color: var(--color-text);
      border-color: var(--color-primary);
      box-shadow: 0 3px 10px rgba(77, 67, 254, 0.3);
    }

    .toggle.active:hover {
      background: var(--color-primary-700);
      color: var(--color-text);
    }

    #footerContainerToggle {
      padding: 5px 8px;
      border-radius: var(--radius-sm);
    }

    /* Range Slider Group */
    .slider-group {
      margin-left: auto;
    }

    #editorSizeInput {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 6px;
      background: var(--superBlue50);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
    }

    #editorSizeInput::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid var(--color-bg);
      box-shadow: 0 2px 6px rgba(77, 67, 254, 0.4);
      transition: transform 0.15s var(--ease-spring);
    }

    #editorSizeInput::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    #editorSizeInput::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid var(--color-bg);
      box-shadow: 0 2px 6px rgba(77, 67, 254, 0.4);
      transition: transform 0.15s var(--ease-spring);
    }

    .number {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 12px;
    }

    #editorSizeOutput {
      display: inline-block;
      min-width: 38px;
      text-align: center;
      padding: 3px 6px;
      background: var(--surface-page-bg);
      border-radius: var(--radius-sm);
      color: var(--color-primary-700);
      border: 1px solid var(--superBlue50);
    }

    /* ==========================================================================
       4. FIND & REPLACE DRAWER (RESPONSIVE FLEX/GRID)
       ========================================================================== */
    #replaceBar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: linear-gradient(90deg, var(--color-neutral-500) 0%, var(--color-bg-3) 100%);
      border-top: 1px solid var(--superBlue50);
      max-height: 220px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.3s var(--ease-spring), opacity 0.2s ease, padding 0.25s ease;
    }

    #replaceBar.hidden {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-top-width: 0;
      pointer-events: none;
    }

    .find-replace-inputs {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .input-with-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .input-with-icon svg {
      position: absolute;
      left: 9px;
      width: 14px;
      height: 14px;
      color: var(--color-neutral-ramp-500);
      pointer-events: none;
    }

    #replaceBar input[type="text"] {
      font-family: var(--font-mono);
      font-size: 12.5px;
      min-height: 32px;
      padding: 5px 10px 5px 28px;
      border: 1px solid var(--color-primary-200);
      border-radius: var(--radius-sm);
      background: var(--surface-page-bg);
      color: var(--color-text-1);
      width: 180px;
      transition: border-color 0.2s, width 0.2s var(--ease-spring), box-shadow 0.2s;
    }

    #replaceBar input[type="text"]:focus {
      width: 210px;
      border-color: var(--color-primary);
    }

    .replace-actions {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    #replaceAllButton {
      background: var(--color-primary-600);
      color: var(--color-text);
      border-color: var(--color-primary-600);
    }

    #replaceAllButton:hover {
      background: var(--color-primary-700);
    }

    #replaceFeedback {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-primary-800);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
    }

    #replaceFeedback:empty {
      display: none;
    }

    /* ==========================================================================
       5. WORKSPACE: ADAPTIVE SPLIT PANES & TOUCH SPLITTER
       ========================================================================== */
    main {
      display: flex;
      flex: 1;
      min-height: 0;
      padding: 10px;
      gap: 0;
      background: var(--color-neutral-500);
      position: relative;
      overflow: hidden;
    }

    main.vertical {
      flex-direction: column;
    }

    .pane-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 120px;
      min-height: 100px;
      background: var(--surface-page-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-neutral-50);
      box-shadow: var(--shadow-xs);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pane-card:focus-within {
      border-color: var(--color-primary-300);
      box-shadow: 0 8px 24px rgba(77, 67, 254, 0.14);
    }

    /* Single-Pane View Modes for Mobile/Tablet */
    main[data-view-mode="code"] #previewerWrapper,
    main[data-view-mode="code"] #splitter {
      display: none !important;
    }

    main[data-view-mode="code"] #editorWrapper {
      flex: 1 1 100% !important;
    }

    main[data-view-mode="preview"] #editorWrapper,
    main[data-view-mode="preview"] #splitter {
      display: none !important;
    }

    main[data-view-mode="preview"] #previewerWrapper {
      flex: 1 1 100% !important;
    }

    /* Pane Header Bar */
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: var(--surface-page-bg);
      border-bottom: 1px solid var(--color-neutral-50);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-neutral-ramp-600);
      user-select: none;
      z-index: 2;
      flex-shrink: 0;
    }

    .pane-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .window-dots {
      display: inline-flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .window-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .window-dots span:nth-child(1) { background: #ff5f56; }
    .window-dots span:nth-child(2) { background: #ffbd2e; }
    .window-dots span:nth-child(3) { background: #27c93f; }

    .file-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      background: var(--color-neutral-500);
      color: var(--color-primary-700);
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: 11.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .pane-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      animation: pulseGlow 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(0.92); }
    }

    /* Editor Body & Synchronized Gutter */
    .editor-body {
      position: relative;
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .line-numbers {
      width: 44px;
      padding: 12px 6px 12px 4px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-neutral-400);
      background: var(--color-neutral-ramp-50);
      border-right: 1px solid var(--color-neutral-50);
      user-select: none;
      overflow: hidden;
      white-space: pre;
      flex-shrink: 0;
      transition: background-color 0.25s, color 0.25s, border-color 0.25s;
    }

    textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 12px 14px;
      outline: 0;
      resize: none;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      color: var(--surface-page-fg);
      background: var(--surface-page-bg);
      tab-size: 2;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Dark Editor Theme (#1b1b1b Raised Surface) */
    #editorWrapper.dark-mode .pane-header {
      background: #141418;
      border-bottom-color: #2d2d35;
      color: var(--color-neutral-400);
    }

    #editorWrapper.dark-mode .file-tab {
      background: #252438;
      color: var(--color-primary-300);
    }

    #editorWrapper.dark-mode .line-numbers {
      background: #16161a;
      border-right-color: #2a2a32;
      color: #656477;
    }

    textarea.dark {
      background: var(--surface-raised-bg);
      color: var(--surface-raised-fg);
      caret-color: var(--color-primary-400);
    }

    textarea.dark::selection {
      background: rgba(77, 67, 254, 0.45);
      color: #ffffff;
    }

    /* Touch-Friendly Interactive Resizer Handle */
    #splitter {
      position: relative;
      flex: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      z-index: 10;
    }

    /* Expanded 28px invisible touch hit area */
    #splitter::before {
      content: '';
      position: absolute;
      inset: 0 -8px;
    }

    main.vertical #splitter {
      cursor: row-resize;
    }

    main.vertical #splitter::before {
      inset: -8px 0;
    }

    .splitter-pill {
      width: 4px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--color-primary-200);
      transition: all 0.2s var(--ease-spring);
    }

    main.vertical .splitter-pill {
      width: 38px;
      height: 4px;
    }

    #splitter:hover .splitter-pill,
    #splitter.dragging .splitter-pill {
      background: var(--color-primary);
      height: 56px;
      box-shadow: 0 0 10px rgba(77, 67, 254, 0.5);
    }

    main.vertical #splitter:hover .splitter-pill,
    main.vertical #splitter.dragging .splitter-pill {
      width: 56px;
      height: 4px;
    }

    /* Previewer Body */
    .preview-body {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #ffffff;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      background: #ffffff;
    }

    body.is-resizing iframe {
      pointer-events: none;
    }

    /* ==========================================================================
       6. FOOTER & STATUS METRICS
       ========================================================================== */
    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 14px;
      background: var(--surface-page-bg);
      border-top: 1px solid var(--color-neutral-50);
      font-size: 12px;
      color: var(--color-neutral-ramp-600);
      z-index: 25;
      flex-shrink: 0;
    }

    footer.hidden {
      display: none;
    }

    .metrics-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 11px;
      background: var(--color-neutral-500);
      border-radius: var(--radius-full);
      border: 1px solid var(--superBlue50);
      color: var(--color-text-1);
      white-space: nowrap;
    }

    .metrics-divider {
      color: var(--color-neutral-400);
    }

    .footer-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .share-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    #share {
      font-weight: 600;
      color: var(--color-neutral-ramp-600);
      margin-right: 2px;
    }

    .social-btn,
    #copyButton {
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-neutral-50);
      background: var(--surface-page-bg);
      color: var(--color-neutral-ramp-700);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s var(--ease-spring);
    }

    .social-btn svg,
    #copyButton svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .social-btn:hover,
    #copyButton:hover {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-text);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(77, 67, 254, 0.28);
    }

    #copyNotification {
      font-weight: 600;
      color: var(--color-primary);
      font-size: 12px;
    }

    #copyNotification:empty {
      display: none;
    }

    address {
      font-style: normal;
      padding-left: 10px;
      border-left: 1px solid var(--color-neutral-50);
      color: var(--color-neutral-ramp-500);
      white-space: nowrap;
    }

    address a {
      color: var(--color-primary-600);
      font-weight: 600;
      text-decoration: none;
    }

    address a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    /* ==========================================================================
       7. MULTI-DEVICE MEDIA QUERIES (TABLET, MOBILE, ULTRA-WIDE)
       ========================================================================== */

    /* Tablet & Compact Laptops (<= 1100px) */
    @media (max-width: 1100px) {
      .brand-subtitle {
        display: none;
      }

      .slider-group {
        margin-left: 0;
      }

      /* Transform toolbar into a sleek single-line horizontal swipe ribbon */
      .toolbar-scroll-area {
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }

      .toolbar-scroll-area::-webkit-scrollbar {
        display: none;
      }

      .control-group {
        scroll-snap-align: start;
      }
    }

    /* Mobile & Small Tablets (<= 820px) */
    @media (max-width: 820px) {
      .toolbar-primary {
        padding: 6px 10px;
        gap: 6px;
      }

      /* Show Code | Split | Preview Switcher in top row */
      .mobile-view-switcher {
        display: inline-flex;
      }

      .toolbar-scroll-area {
        flex-basis: 100%;
        order: 3;
        padding-top: 4px;
        border-top: 1px solid var(--color-neutral-ramp-100);
      }

      /* Hide slider when in full Code or Preview tab */
      main:not([data-view-mode="split"]) ~ header .slider-group {
        display: none;
      }

      main {
        padding: 6px;
      }

      .pane-card {
        border-radius: var(--radius-md);
      }

      /* Reflow Find & Replace cleanly for mobile keyboards */
      #replaceBar {
        padding: 8px 10px;
        gap: 6px;
      }

      .find-replace-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        gap: 6px;
      }

      .find-replace-inputs .control-label {
        display: none;
      }

      .input-with-icon,
      #replaceBar input[type="text"],
      #replaceBar input[type="text"]:focus {
        width: 100%;
      }

      .replace-actions {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
      }

      .replace-actions::-webkit-scrollbar {
        display: none;
      }
    }

    /* Compact Smartphones (<= 540px) */
    @media (max-width: 540px) {
      .brand {
        border-right: 0;
        padding-right: 4px;
      }

      .btn-text-optional {
        display: none;
      }

      button,
      .btn-link,
      .file-upload-label,
      select {
        min-height: 34px;
        padding: 5px 9px;
      }

      .line-numbers {
        width: 36px;
        padding: 10px 4px 10px 2px;
      }

      textarea {
        padding: 10px;
      }

      footer {
        padding: 6px 10px;
        gap: 6px;
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
      }

      footer::-webkit-scrollbar {
        display: none;
      }

      .footer-right {
        flex-wrap: nowrap;
      }

      #share {
        display: none;
      }
    }

    /* Accessibility: Reduced Motion Preference */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        <a class="social-btn" href="mailto:?subject=HTML%20Editor%3A%20Online%20HTML%20Editor%20with%20Real-Time%20Preview&body=https%3A%2F%2Fhtmleditor.gitlab.io" target="_blank" rel="noopener" title="Share via Email">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </a>
        <button type="button" id="copyButton" title="Copy page URL">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>

        <output id="copyNotification"></output>

      </address>

  <!-- ==================== APPLICATION SCRIPT ==================== -->
  <script>
    // ====================
    // Constants and Variables
    // ====================
    const downloadLink = document.getElementById('downloadLink');
    const fontSizeSelector = document.getElementById('fontSizeSelector');
    const previewSelector = document.getElementById('previewSelector');
    const runButton = document.getElementById('runButton');
    const resetButton = document.getElementById('resetButton');
    const selectButton = document.getElementById('selectButton');
    const fileInput = document.getElementById('fileInput');
    const activeFileName = document.getElementById('activeFileName');
    const editorSizeInput = document.getElementById('editorSizeInput');
    const editorSizeOutput = document.getElementById('editorSizeOutput');
    const verticalViewToggle = document.getElementById('verticalViewToggle');
    const darkEditorToggle = document.getElementById('darkEditorToggle');
    const spellcheckToggle = document.getElementById('spellcheckToggle');
    const replaceBarToggle = document.getElementById('replaceBarToggle');
    const footerContainerToggle = document.getElementById('footerContainerToggle');
    const replaceBar = document.getElementById('replaceBar');
    const findInput = document.getElementById('findInput');
    const replaceInput = document.getElementById('replaceInput');
    const matchCaseToggle = document.getElementById('matchCaseToggle');
    const wholeWordToggle = document.getElementById('wholeWordToggle');
    const regexModeToggle = document.getElementById('regexModeToggle');
    const toggleButtons = document.querySelectorAll('.toggle');
    const viewModeButtons = document.querySelectorAll('.view-mode-btn');
    const replaceAllButton = document.getElementById('replaceAllButton');
    const undoButton = document.getElementById('undoButton');
    const replaceFeedback = document.getElementById('replaceFeedback');
    const mainContainer = document.querySelector('main');
    const editorWrapper = document.getElementById('editorWrapper');
    const previewerWrapper = document.getElementById('previewerWrapper');
    const previewBody = document.getElementById('previewBody');
    const previewDimensions = document.getElementById('previewDimensions');
    const splitter = document.getElementById('splitter');
    const editor = document.querySelector('textarea');
    const lineNumbers = document.getElementById('lineNumbers');
    const cursorPosition = document.getElementById('cursorPosition');
    const previewer = document.querySelector('iframe');
    const footerContainer = document.querySelector('footer');
    const characterCount = document.getElementById('characterCount');
    const characterLabel = document.getElementById('characterLabel');
    const byteCount = document.getElementById('byteCount');
    const byteLabel = document.getElementById('byteLabel');
    const copyButton = document.getElementById('copyButton');
    const copyNotification = document.getElementById('copyNotification');
    const numberFormatter = new Intl.NumberFormat();
    let previousEditorValue = null;
    let userToggledOrientationManually = false;

    // ====================
    // Reusable Functions
    // ====================
    function createContentBlob() {
      return new Blob([editor.value], {
        type: 'text/html; charset=utf-8'
      });
    }

    function debounce(callback) {
      let timeout = null;
      return delay => {
        clearTimeout(timeout);
        timeout = setTimeout(callback, delay);
      };
    }

    function toggleClass(element, className, force) {
      element.classList.toggle(className, force);
    }

    function isActive(button) {
      return button.classList.contains('active');
    }

    function deactivate(button) {
      button.classList.remove('active');
    }

    function escapeRegExpFallback(str) {
      return typeof RegExp.escape === 'function'
        ? RegExp.escape(str)
        : str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function interpretEscapeSequences(str) {
      const escapeMap = {
        '\\n': '\n',
        '\\r': '\r',
        '\\t': '\t',
        '\\\\': '\\',
      };
      return str.replace(/\\[nrt\\]/g, match => escapeMap[match]);
    }

    function separateThousands(number) {
      return numberFormatter.format(number);
    }

    // ====================
    // Core Functions
    // ====================
    function createDownloadURL() {
      if (this.href && this.href.startsWith('blob:')) {
        URL.revokeObjectURL(this.href);
      }
      const blob = createContentBlob();
      this.href = URL.createObjectURL(blob);
    }

    function resizeFont() {
      const size = `${fontSizeSelector.value}px`;
      editor.style.fontSize = size;
      lineNumbers.style.fontSize = size;
    }

    function resizeEditor() {
      const editorSizeInputValue = Number(editorSizeInput.value);
      editorWrapper.style.flexGrow = editorSizeInputValue;
      editorWrapper.style.flexBasis = '0%';
      previewerWrapper.style.flexGrow = 100 - editorSizeInputValue;
      previewerWrapper.style.flexBasis = '0%';
      editorSizeOutput.value = (editorSizeInputValue / 100).toFixed(2);
    }

    function updateLineNumbers() {
      const linesCount = editor.value.split('\n').length;
      let numbersText = '';
      for (let i = 1; i <= linesCount; i++) {
        numbersText += i + '\n';
      }
      lineNumbers.textContent = numbersText;
    }

    function updateCursorPosition() {
      const textUpToCursor = editor.value.slice(0, editor.selectionStart);
      const lines = textUpToCursor.split('\n');
      const currentLine = lines.length;
      const currentCol = lines[lines.length - 1].length + 1;
      cursorPosition.textContent = `Ln ${currentLine}, Col ${currentCol}`;
    }

    function updatePlaceholder() {
      findInput.placeholder = isActive(regexModeToggle) ? 'pattern or /pattern/flags' : 'Find in code...';
    }

    function clearReplaceFeedback() {
      if (replaceFeedback.value) {
        replaceFeedback.value = '';
      }
    }

    function clearUndoState() {
      if (previousEditorValue !== null) {
        previousEditorValue = null;
        undoButton.disabled = true;
      }
    }

    function preview() {
      previewer.srcdoc = editor.value;
    }

    function updateCharacterCount() {
      const characterCountValue = editor.value.length;
      characterCount.textContent = separateThousands(characterCountValue);
      characterLabel.textContent = characterCountValue === 1 ? 'character' : 'characters';
    }

    function updateByteCount() {
      const blob = createContentBlob();
      const byteCountValue = blob.size;
      byteCount.textContent = separateThousands(byteCountValue);
      byteLabel.textContent = byteCountValue === 1 ? 'byte' : 'bytes';
    }

    function updateDocumentMetrics() {
      if (!footerContainer.classList.contains('hidden')) {
        updateCharacterCount();
        updateByteCount();
      }
    }

    function syncDarkWrapper() {
      const darkActive = isActive(darkEditorToggle);
      toggleClass(editor, 'dark', darkActive);
      toggleClass(editorWrapper, 'dark-mode', darkActive);
    }

    // Set View Mode (Code | Split | Preview)
    function setWorkspaceViewMode(mode) {
      mainContainer.setAttribute('data-view-mode', mode);
      viewModeButtons.forEach(btn => {
        const active = btn.dataset.mode === mode;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active);
      });
    }

    // Auto-adapt orientation on narrow mobile screens unless manually overridden
    function handleResponsiveOrientation() {
      if (window.innerWidth > 820 && mainContainer.getAttribute('data-view-mode') !== 'split') {
        setWorkspaceViewMode('split');
      }
      if (!userToggledOrientationManually) {
        const shouldStackVertically = window.innerWidth <= 820;
        toggleClass(verticalViewToggle, 'active', shouldStackVertically);
        toggleClass(mainContainer, 'vertical', shouldStackVertically);
      }
    }

    // ====================
    // Debounced Functions
    // ====================
    const debouncedPreview = debounce(preview);
    const debouncedUpdateDocumentMetrics = debounce(updateDocumentMetrics);
    const debouncedClearCopyNotification = debounce(() => copyNotification.value = '');

    // ====================
    // Preview Update Dispatcher
    // ====================
    function dispatchPreviewUpdate() {
      const previewSelectorValue = previewSelector.value;
      if (previewSelectorValue === 'Instant') {
        preview();
      } else if (previewSelectorValue !== 'Manual') {
        debouncedPreview(Number(previewSelectorValue));
      }
    }

    // ====================
    // Event Listeners
    // ====================
    downloadLink.addEventListener('click', createDownloadURL);
    downloadLink.addEventListener('contextmenu', createDownloadURL);

    fontSizeSelector.addEventListener('change', resizeFont);

    runButton.addEventListener('click', () => {
      preview();
      if (window.innerWidth <= 820 && mainContainer.getAttribute('data-view-mode') === 'code') {
        setWorkspaceViewMode('preview');
      }
    });

    editorSizeInput.addEventListener('input', resizeEditor);

    viewModeButtons.forEach(btn => {
      btn.addEventListener('click', () => setWorkspaceViewMode(btn.dataset.mode));
    });

    window.addEventListener('resize', handleResponsiveOrientation);

    // Live Viewport Size Observer for Preview Pane
    if ('ResizeObserver' in window) {
      const previewObserver = new ResizeObserver(entries => {
        for (const entry of entries) {
          const width = Math.round(entry.contentRect.width);
          const height = Math.round(entry.contentRect.height);
          if (width > 0 && height > 0) {
            previewDimensions.textContent = `${width} × ${height} px`;
          }
        }
      });
      previewObserver.observe(previewBody);
    }

    // Synchronize line numbers scroll with textarea scroll
    editor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    editor.addEventListener('keyup', updateCursorPosition);
    editor.addEventListener('click', updateCursorPosition);

    // Keyboard shortcuts: Tab indentation, Ctrl+Enter Run, Ctrl+F Replace Bar
    editor.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updateLineNumbers();
        updateCursorPosition();
        dispatchPreviewUpdate();
        debouncedUpdateDocumentMetrics(500);
      }
    });

    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        preview();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        replaceBarToggle.classList.add('active');
        replaceBar.classList.remove('hidden');
        findInput.focus();
      }
    });

    // Touch & Pointer Drag Resizer
    let isDraggingSplitter = false;
    splitter.addEventListener('pointerdown', e => {
      isDraggingSplitter = true;
      splitter.classList.add('dragging');
      document.body.classList.add('is-resizing');
      splitter.setPointerCapture(e.pointerId);
    });

    splitter.addEventListener('pointermove', e => {
      if (!isDraggingSplitter) return;
      const rect = mainContainer.getBoundingClientRect();
      const isVertical = mainContainer.classList.contains('vertical');
      let ratio = isVertical
        ? ((e.clientY - rect.top) / rect.height) * 100
        : ((e.clientX - rect.left) / rect.width) * 100;
      ratio = Math.min(85, Math.max(15, Math.round(ratio)));
      editorSizeInput.value = ratio;
      resizeEditor();
    });

    const stopDraggingSplitter = () => {
      if (!isDraggingSplitter) return;
      isDraggingSplitter = false;
      splitter.classList.remove('dragging');
      document.body.classList.remove('is-resizing');
    };
    splitter.addEventListener('pointerup', stopDraggingSplitter);
    splitter.addEventListener('pointercancel', stopDraggingSplitter);

    for (const button of toggleButtons) {
      button.addEventListener('click', function() {
        toggleClass(this, 'active');
        if (this === verticalViewToggle) {
          userToggledOrientationManually = true;
          toggleClass(mainContainer, 'vertical');
          if (mainContainer.getAttribute('data-view-mode') !== 'split') {
            setWorkspaceViewMode('split');
          }
        } else if (this === darkEditorToggle) {
          syncDarkWrapper();
        } else if (this === spellcheckToggle) {
          editor.spellcheck = !editor.spellcheck;
        } else if (this === replaceBarToggle) {
          toggleClass(replaceBar, 'hidden');
          if (!replaceBar.classList.contains('hidden')) {
            findInput.focus();
          }
        } else if (this === footerContainerToggle) {
          toggleClass(footerContainer, 'hidden');
          updateDocumentMetrics();
        } else if (this === matchCaseToggle || this === wholeWordToggle) {
          deactivate(regexModeToggle);
          updatePlaceholder();
          clearReplaceFeedback();
        } else if (this === regexModeToggle) {
          deactivate(matchCaseToggle);
          deactivate(wholeWordToggle);
          updatePlaceholder();
          clearReplaceFeedback();
        }
      });
    }

    for (const textField of [findInput, replaceInput, editor]) {
      textField.addEventListener('input', function() {
        clearReplaceFeedback();
        if (this === editor) {
          clearUndoState();
          updateLineNumbers();
          updateCursorPosition();
          dispatchPreviewUpdate();
          debouncedUpdateDocumentMetrics(500);
        }
      });
    }

    resetButton.addEventListener('click', () => {
      if (editor.value && editor.value !== editor.defaultValue && !confirm('Are you sure you want to reset the editor content to the default template?\nAll unsaved changes will be lost.')) {
        return;
      }
      fileInput.value = '';
      downloadLink.download = 'template.html';
      activeFileName.textContent = 'template.html';
      editor.value = editor.defaultValue;
      clearReplaceFeedback();
      clearUndoState();
      updateLineNumbers();
      updateCursorPosition();
      dispatchPreviewUpdate();
      updateDocumentMetrics();
    });

    selectButton.addEventListener('click', () => {
      if (mainContainer.getAttribute('data-view-mode') === 'preview') {
        setWorkspaceViewMode('code');
      }
      editor.focus();
      editor.select();
    });

    fileInput.addEventListener('change', async function() {
      const file = this.files[0];
      if (file) {
        downloadLink.download = file.name;
        activeFileName.textContent = file.name;
        editor.value = await file.text();
        clearReplaceFeedback();
        clearUndoState();
        updateLineNumbers();
        updateCursorPosition();
        dispatchPreviewUpdate();
        updateDocumentMetrics();
      }
    });

    replaceAllButton.addEventListener('click', () => {
      const findInputValue = findInput.value;
      const replaceInputValue = replaceInput.value;
      const currentEditorValue = editor.value;
      const isCaseSensitive = isActive(matchCaseToggle);
      const isWholeWord = isActive(wholeWordToggle);
      const isRegex = isActive(regexModeToggle);

      if (!findInputValue) {
        replaceFeedback.value = 'No find term entered';
        return;
      }

      let pattern;
      let flags = 'g';
      let regex;
      if (isRegex) {
        const regexLiteralMatch = findInputValue.match(/^\/(.*)\/(.*)$/);
        if (regexLiteralMatch) {
          [, pattern, flags] = regexLiteralMatch;
          if (!flags.includes('g')) {
            flags += 'g';
          }
        } else {
          pattern = findInputValue;
        }
      } else {
        pattern = escapeRegExpFallback(findInputValue);
        if (isWholeWord) {
          pattern = `(?<![\\p{L}\\p{N}_])${pattern}(?![\\p{L}\\p{N}_])`;
          flags += 'u';
        }
        if (!isCaseSensitive) {
          flags += 'i';
        }
      }
      try {
        regex = new RegExp(pattern, flags);
      } catch (error) {
        replaceFeedback.value = error.message;
        return;
      }

      const matches = currentEditorValue.match(regex);
      if (matches) {
        const matchCount = matches.length;
        previousEditorValue = currentEditorValue;
        editor.value = currentEditorValue.replace(regex, isRegex ? interpretEscapeSequences(replaceInputValue) : () => replaceInputValue);
        replaceFeedback.innerHTML = `<span class="number">${separateThousands(matchCount)}</span> ${matchCount === 1 ? 'replacement' : 'replacements'} made`;
        undoButton.disabled = false;
        updateLineNumbers();
        dispatchPreviewUpdate();
        updateDocumentMetrics();
      } else {
        replaceFeedback.value = 'No matches found';
      }
    });

    undoButton.addEventListener('click', () => {
      editor.value = previousEditorValue;
      replaceFeedback.value = 'Replacement undone';
      clearUndoState();
      updateLineNumbers();
      dispatchPreviewUpdate();
      updateDocumentMetrics();
    });

    copyButton.addEventListener('click', () => {
      navigator.clipboard.writeText(location.href);
      copyNotification.value = 'Link copied!';
      debouncedClearCopyNotification(2000);
    });

    // Save the current state to localStorage
    document.addEventListener('visibilitychange', function() {
      if (this.hidden) {
        const currentState = {
          spellcheckToggle: spellcheckToggle.className,
          verticalViewToggle: verticalViewToggle.className,
          darkEditorToggle: darkEditorToggle.className,
          replaceBarToggle: replaceBarToggle.className,
          footerContainerToggle: footerContainerToggle.className,
          matchCaseToggle: matchCaseToggle.className,
          wholeWordToggle: wholeWordToggle.className,
          regexModeToggle: regexModeToggle.className,
          fontSizeSelector: fontSizeSelector.value,
          previewSelector: previewSelector.value,
          editorSizeInput: editorSizeInput.value,
          findInput: findInput.value,
          replaceInput: replaceInput.value,
          editor: editor.value,
        };
        localStorage.setItem('comdex_editor_state', JSON.stringify(currentState));
      }
    });

    // ====================
    // Initialization
    // ====================
    const restoredState = JSON.parse(localStorage.getItem('comdex_editor_state'));
    if (restoredState) {
      spellcheckToggle.className = restoredState.spellcheckToggle;
      verticalViewToggle.className = restoredState.verticalViewToggle;
      darkEditorToggle.className = restoredState.darkEditorToggle;
      replaceBarToggle.className = restoredState.replaceBarToggle;
      footerContainerToggle.className = restoredState.footerContainerToggle;
      matchCaseToggle.className = restoredState.matchCaseToggle;
      wholeWordToggle.className = restoredState.wholeWordToggle;
      regexModeToggle.className = restoredState.regexModeToggle;
      fontSizeSelector.value = restoredState.fontSizeSelector;
      previewSelector.value = restoredState.previewSelector;
      editorSizeInput.value = restoredState.editorSizeInput;
      findInput.value = restoredState.findInput;
      replaceInput.value = restoredState.replaceInput;
      editor.value = restoredState.editor;
      userToggledOrientationManually = isActive(verticalViewToggle);
    }

    editor.spellcheck = isActive(spellcheckToggle);
    toggleClass(mainContainer, 'vertical', isActive(verticalViewToggle));
    handleResponsiveOrientation();
    syncDarkWrapper();
    toggleClass(replaceBar, 'hidden', !isActive(replaceBarToggle));
    toggleClass(footerContainer, 'hidden', !isActive(footerContainerToggle));
    resizeFont();
    resizeEditor();
    updateLineNumbers();
    updateCursorPosition();
    updatePlaceholder();
    dispatchPreviewUpdate();
    updateDocumentMetrics();
  </script>
